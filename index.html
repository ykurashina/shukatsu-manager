<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="新卒就活を一元管理するブラウザアプリ。企業管理、ES管理、選考スケジュール、面接記録をまとめて管理できます。">
  <title>就活管理</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Google Identity Services (ログイン用) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Google API Client Library (ドライブ操作用) -->
  <script src="https://apis.google.com/js/api.js" async defer></script>

  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/table.css">
  <link rel="stylesheet" href="css/kanban.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/es-manager.css">
  <link rel="stylesheet" href="css/bookmarks.css">
</head>
<body>
  <!-- 初回起動時 / ログイン画面 -->
  <div id="setup-screen" class="setup-screen" style="display: none;">
    <div class="setup-card">
      <div class="setup-header">
        <div class="setup-icon">
          <i data-lucide="briefcase-business"></i>
        </div>
        <h1>就活管理</h1>
        <p class="setup-subtitle">新卒就活を一元管理するアプリへようこそ</p>
      </div>

      <div class="setup-options">
        <!-- Googleドライブ同期モード（メイン） -->
        <div class="setup-option setup-option-recommended" id="setup-google-mode">
          <div class="setup-option-badge">推奨</div>
          <div class="setup-option-icon">
            <i data-lucide="cloud"></i>
          </div>
          <h3>Googleドライブで同期</h3>
          <p>Googleアカウントでログインし、ドライブ上にデータを自動保存します。PCとスマホで同期できます。</p>
          <button class="btn btn-primary" id="setup-google-btn">Googleアカウントでログイン</button>
          <p class="setup-note"><i data-lucide="info" style="width:14px;height:14px;"></i> Googleアカウントが必要です</p>
        </div>

        <!-- ブラウザ内保存モード（代替） -->
        <div class="setup-option" id="setup-local-mode">
          <div class="setup-option-icon">
            <i data-lucide="smartphone"></i>
          </div>
          <h3>ブラウザ内に保存</h3>
          <p>Googleアカウント無しで利用できます。ただし、データはこのブラウザ内のみに保存され、他の端末とは同期されません。</p>
          <button class="btn btn-secondary" id="setup-local-btn">ブラウザ内保存で開始</button>
          <p class="setup-note warning"><i data-lucide="alert-triangle" style="width:14px;height:14px;"></i> キャッシュ削除でデータが消える可能性があります</p>
        </div>
      </div>
    </div>
  </div>

  <!-- メインアプリケーション -->
  <div id="app" class="app-layout" style="display: none;">
    <!-- オフラインバナー -->
    <div id="offline-banner" class="offline-banner" style="display: none;">
      <i data-lucide="wifi-off" style="width:16px;height:16px;"></i>
      <span>オフラインモード — データの変更はできません</span>
    </div>

    <!-- ヘッダー -->
    <header class="app-header" id="app-header">
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="メニュー">
        <i data-lucide="menu"></i>
      </button>
      <div class="header-title" id="header-title"></div>
      <div class="storage-indicator" id="storage-indicator"></div>
    </header>

    <!-- サイドバー -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- メインコンテンツ -->
    <main class="main-content" id="main-content"></main>
  </div>

  <!-- アプリのJS（ES Modules） -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
